# Durable tool approval endpoint

approve-tools:
  post:
    operationId: approveAsyncTools
    summary: Decide one saved tool call
    description: Requires the original authentication and MCP execution scope. Arguments are restored from the database. The job resumes when every pending call has a decision. Identical retries are accepted; changing a saved decision or its feedback returns 409.
    tags: [Async Jobs]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [job_id, tool_call_request_id, tool_call_id, approved]
            properties:
              job_id:
                type: string
              tool_call_request_id:
                type: string
              tool_call_id:
                type: string
              approved:
                type: boolean
                description: True approves the call; false rejects it.
              further_instructions:
                type: string
                description: Optional guidance for a rejected call. Nonempty text requires approved=false. Trimmed and appended once as a user message after the group's tool results when the job resumes.
    responses:
      '202':
        description: Decision accepted; continuation starts once every call is decided
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/async.yaml#/AsyncJobResponse'
      '400':
        description: Invalid or missing decision
      '404':
        description: Job not found or execution scope does not match
      '409':
        description: Approval is stale or has a different saved decision
    security:
    - BearerAuth: []
    - BasicAuth: []
    - VirtualKeyAuth: []
    - ApiKeyAuth: []
